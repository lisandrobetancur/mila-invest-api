name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mila
          POSTGRES_PASSWORD: mila
          POSTGRES_DB: mila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mila -d mila"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgres://mila:mila@localhost:5432/mila
      TEST_DATABASE_URL: postgres://mila:mila@localhost:5432/mila_test
      JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      DOCUMENT_PEPPER: ci-pepper-0123456789abcdef
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm db:migrate

      - run: pnpm test:coverage

      - run: pnpm build

      - name: docs/openapi.json está actualizado
        run: |
          pnpm openapi:export
          git diff --exit-code -- docs/openapi.json
